[project]
name = "fantasy-football"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Serena Zhu", email = "srz24@cornell.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "espn-api>=1.0.0",
    "fastapi>=0.143.0",
    "lxml>=6.1.3",
    "nflreadpy>=0.1.5",
    "openai>=2.54.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
fantasy-football = "fantasy_football:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
